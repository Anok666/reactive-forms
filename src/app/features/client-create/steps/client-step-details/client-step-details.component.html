<section class="grid w-full min-w-0 max-w-full gap-4 md:grid-cols-2 md:gap-x-6">
  <ng-container [formGroup]="form()">
    <div class="flex min-w-0 flex-col gap-2 md:col-span-2">
      <label for="clientType" class="font-medium">Typ klienta</label>
      <p-select
        inputId="clientType"
        [options]="clientTypes"
        optionLabel="label"
        optionValue="value"
        placeholder="Wybierz typ"
        formControlName="clientType"
        [fluid]="true"
      />
      <div class="form-field-message-slot md:break-words" aria-live="polite">
        @if (showError('clientType')) {
          <small class="block text-red-500" role="alert">Typ klienta jest wymagany.</small>
        }
      </div>
    </div>

    @if (form().controls.clientType.value === 'PERSON') {
      <app-client-details-person-fields [form]="form()" />
    }

    @if (form().controls.clientType.value === 'COMPANY') {
      <app-client-details-company-fields [form]="form()" />
    }

    <div class="flex min-w-0 flex-col gap-2 md:col-span-2">
      <label for="email" class="font-medium">Email</label>
      <input
        id="email"
        pInputText
        type="email"
        placeholder="kontakt@test.com"
        formControlName="email"
        [fluid]="true"
      />
      <div class="form-field-message-slot md:break-words" aria-live="polite">
        @if (showError('email')) {
          <small class="block text-red-500" role="alert">Podaj poprawny adres email.</small>
        }
      </div>
    </div>
  </ng-container>
</section>
