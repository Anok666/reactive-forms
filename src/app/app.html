<div class="flex min-h-screen flex-col">
  <header
    class="flex shrink-0 flex-wrap items-center justify-end gap-3 border-b border-surface-200 bg-surface-0 px-4 py-2 dark:border-surface-700 dark:bg-surface-900"
  >
    <span class="text-sm text-surface-600 dark:text-surface-400">Motyw</span>
    <p-selectbutton
      [options]="theme.schemeOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="theme.preference()"
      (ngModelChange)="theme.setPreference($event)"
      [allowEmpty]="false"
    />
  </header>
  <div class="flex min-h-0 flex-1 flex-col">
    <router-outlet />
  </div>
</div>
